;stroke-width:1.6;" width="183.2788" x="22.5" y="321.9414"/><rect fill="#E6F1ED" height="7" style="stroke:#E6F1ED;stroke-width:1.6;" width="183.2788" x="22.5" y="342.2324"/><rect codeLine="46" fill="none" height="104.4551" id="Customer" rx="7" ry="7" style="stroke:#0E5C45;stroke-width:1.6;" width="183.2788" x="22.5" y="321.9414"/><text fill="#33413C" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="55.4595" x="86.4097" y="340.9697">Customer</text><line style="stroke:#0E5C45;stroke-width:1.6;" x1="23.5" x2="204.7788" y1="349.2324" y2="349.2324"/><text fill="#33413C" font-family="Segoe UI" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="38.7334" x="28.5" y="367.2607">phone</text><text fill="#33413C" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="128.9844" x="70.7944" y="367.2607">: string  (10 digits, key)</text><text fill="#33413C" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="74.5088" x="28.5" y="384.5518">name : string</text><text fill="#33413C" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="149.3667" x="28.5" y="401.8428">name_hi : string [optional]</text><text fill="#33413C" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="150.0649" x="28.5" y="419.1338">name_te : string [optional]</text></g><!--class Entry--><g id="elem_Entry"><rect codeLine="53" fill="#FFFFFF" height="173.6191" id="Entry" rx="7" ry="7" style="stroke:#0E5C45;stroke-width:1.6;" width="213.1064" x="62.5" y="521.9414"/><rect fill="#E6F1ED" height="27.291" rx="7" ry="7" style="stroke:#E6F1ED;stroke-width:1.6;" width="213.1064" x="62.5" y="521.9414"/><rect fill="#E6F1ED" height="7" style="stroke:#E6F1ED;stroke-width:1.6;" width="213.1064" x="62.5" y="542.2324"/><rect codeLine="53" fill="none" height="173.6191" id="Entry" rx="7" ry="7" style="stroke:#0E5C45;stroke-width:1.6;" width="213.1064" x="62.5" y="521.9414"/><text fill="#33413C" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="29.1484" x="154.479" y="540.9697">Entry</text><line style="stroke:#0E5C45;stroke-width:1.6;" x1="63.5" x2="274.6064" y1="549.2324" y2="549.2324"/><text fill="#33413C" font-family="Segoe UI" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="11.7432" x="68.5" y="567.2607">id</text><text fill="#33413C" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="98.0396" x="83.8042" y="567.2607">: string  (uid, key)</text><text fill="#33413C" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="201.1064" x="68.5" y="584.5518">phone : string  (refers to Customer)</text><text fill="#33413C" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="128.1465" x="68.5" y="601.8428">type : credit | payment</text><text fill="#33413C" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="185.2056" x="68.5" y="619.1338">amount : number  (rupees, 2 dp)</text><text fill="#33413C" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="116.1304" x="68.5" y="636.4248">date : YYYY-MM-DD</text><text fill="#33413C" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="68.7197" x="68.5" y="653.7158">note : string</text><text fill="#33413C" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="148.7319" x="68.5" y="671.0068">shot : JPEG data URL | null</text><text fill="#33413C" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="181.0288" x="68.5" y="688.2979">seq : integer  (same-date order)</text></g><!--class Preferences--><g id="elem_Preferences"><rect codeLine="66" fill="#FFFFFF" height="87.1641" id="Preferences" rx="7" ry="7" style="stroke:#0E5C45;stroke-width:1.6;" width="159.4053" x="608.5" y="112.9414"/><rect fill="#E6F1ED" height="44.582" rx="7" ry="7" style="stroke:#E6F1ED;stroke-width:1.6;" width="159.4053" x="608.5" y="112.9414"/><rect fill="#E6F1ED" height="7" style="stroke:#E6F1ED;stroke-width:1.6;" width="159.4053" x="608.5" y="150.5234"/><rect codeLine="66" fill="none" height="87.1641" id="Preferences" rx="7" ry="7" style="stroke:#0E5C45;stroke-width:1.6;" width="159.4053" x="608.5" y="112.9414"/><text fill="#0E5C45" font-family="Segoe UI" font-size="13" font-style="italic" lengthAdjust="spacing" textLength="78.9902" x="648.7075" y="131.9697">&#171;per browser&#187;</text><text fill="#33413C" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="66.46" x="654.9727" y="149.2607">Preferences</text><line style="stroke:#0E5C45;stroke-width:1.6;" x1="609.5" x2="766.9053" y1="157.5234" y2="157.5234"/><text fill="#33413C" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="130.7554" x="614.5" y="175.5518">hisaab.lang : en | hi | te</text><text fill="#33413C" font-family="Segoe UI" font-size="13" lengthAdjust="spacing" textLength="147.4053" x="614.5" y="192.8428">hisaab.theme : light | dark</text></g><g id="elem_GMN11"><path d="M351.5,311.9414 L351.5,435.6289 A7,7 0 0 0 358.5,442.6289 L699.127,442.6289 A7,7 0 0 0 706.127,435.6289 L706.127,314.9414 L696.127,304.9414 L358.5,304.9414 A7,7 0 0 0 351.5,311.9414 " fill="#F5F8F6" style="stroke:#9DB8AD;stroke-width:0.5;"/><path d="M696.127,304.9414 L696.127,311.4414 A3.5,3.5 0 0 0 699.627,314.9414 L706.127,314.9414 L696.127,304.9414 " fill="#F5F8F6" style="stroke:#9DB8AD;stroke-width:1.0;"/><text fill="#33413C" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="121.3301" x="357.5" y="322.8906">Derived, never stored</text><text fill="#33413C" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="301.3242" x="357.5" y="338.8516">balance = sum(credit amounts) - sum(payment amounts)</text><text fill="#33413C" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="147.9551" x="357.5" y="354.8125">balance &gt; 0 : owes the shop</text><text fill="#33413C" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="127.8281" x="357.5" y="370.7734">balance &lt; 0 : in advance</text><text fill="#33413C" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="180.5977" x="357.5" y="386.7344">days overdue (balance &gt; 0 only) =</text><text fill="#33413C" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="176.6719" x="364.0742" y="402.6953">max(0, today - last payment date,</text><text fill="#33413C" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="189.0059" x="364.0742" y="418.6563">or first credit date when never paid)</text><text fill="#33413C" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="333.627" x="357.5" y="434.6172">today = ?today=YYYY-MM-DD when valid, else the device date</text></g><g id="elem_GMN14"><path d="M28.5,765.9414 L28.5,825.7852 A7,7 0 0 0 35.5,832.7852 L302.2051,832.7852 A7,7 0 0 0 309.2051,825.7852 L309.2051,768.9414 L299.2051,758.9414 L173,758.9414 L169,695.9414 L165,758.9414 L35.5,758.9414 A7,7 0 0 0 28.5,765.9414 " fill="#F5F8F6" style="stroke:#9DB8AD;stroke-width:0.5;"/><path d="M299.2051,758.9414 L299.2051,765.4414 A3.5,3.5 0 0 0 302.7051,768.9414 L309.2051,768.9414 L299.2051,758.9414 " fill="#F5F8F6" style="stroke:#9DB8AD;stroke-width:0.5;"/><text fill="#33413C" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="94.3008" x="34.5" y="776.8906">Running balance</text><text fill="#33413C" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="88.9395" x="132.0879" y="776.8906">(customer page):</text><text fill="#33413C" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="259.7051" x="34.5" y="792.8516">entries of one customer sorted by date, then seq,</text><text fill="#33413C" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="191.0508" x="34.5" y="808.8125">oldest first; balance after each entry.</text><text fill="#33413C" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="102" x="34.5" y="824.7734">Shown newest first.</text></g><g id="elem_GMN17"><path d="M349,118.4414 L349,152.4414 L313.62,156.4414 L349,160.4414 L349,194.2461 A7,7 0 0 0 356,201.2461 L566.209,201.2461 A7,7 0 0 0 573.209,194.2461 L573.209,121.4414 L563.209,111.4414 L356,111.4414 A7,7 0 0 0 349,118.4414 " fill="#F5F8F6" style="stroke:#9DB8AD;stroke-width:0.5;"/><path d="M563.209,111.4414 L563.209,117.9414 A3.5,3.5 0 0 0 566.709,121.4414 L573.209,121.4414 L563.209,111.4414 " fill="#F5F8F6" style="stroke:#9DB8AD;stroke-width:0.5;"/><text fill="#33413C" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="100.6758" x="355" y="129.3906">Total outstanding</text><text fill="#33413C" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="8.209" x="458.9629" y="129.3906">=</text><text fill="#33413C" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="180.6563" x="355" y="145.3516">sum of all balances, so a customer</text><text fill="#33413C" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="203.209" x="355" y="161.3125">in advance reduces it. The owed figure</text><text fill="#33413C" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="159.4863" x="355" y="177.2734">(balances above 0) is in a note</text><text fill="#33413C" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="160.8105" x="355" y="193.2344">below the total when it differs.</text></g><!--reverse link Shop to Customer--><g id="link_Shop_Customer"><path codeLine="72" d="M178.3139,237.0667 C163.6139,268.1067 151.7,293.2914 138.17,321.8714 " fill="none" id="Shop-backto-Customer" style="stroke:#0E5C45;stroke-width:1.4;"/><polygon fill="#0E5C45" points="183.45,226.2214,177.2668,229.932,178.3139,237.0667,184.497,233.3561,183.45,226.2214" style="stroke:#0E5C45;stroke-width:1.4;"/><text fill="#33413C" 